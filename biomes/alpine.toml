[biome]
name = "alpine"
description = "High mountain: talus and bare rock above the treeline, tundra and meadow turf below it, permanent snow on the coldest ground."
sharpness = 3.0

[atmosphere]
latitude_deg = 46.5
day_of_year = 172
time_of_day_h = 11.0
turbidity = 1.8
rayleigh = 2.2
visibility_km = 90.0
haze_colour = "#d2deeb"
ground_albedo = "#8a8e8c"

[layer.glacial_wash]
material = "river_rock"
blend_contrast = 0.5
weight = "smoothstep(flow, 0.55, 0.78) * step(slope < 0.4)"

[layer.glacial_silt]
material = "silt"
weight = "smoothstep(deposition, 0.45, 0.8) * step(slope < 0.15) * (1 - smoothstep(flow, 0.55, 0.8))"
variation = 0.2
variation_m = 450.0

[layer.tundra_turf]
material = "dry_grass"
weight = "(1 - smoothstep(slope, 0.28, 0.45)) * (1 - smoothstep(moisture, 0.36, 0.54)) * smoothstep(temperature, 0.28, 0.42) * patchiness_mid"
variation = 0.3
variation_m = 700.0

[layer.alpine_meadow]
material = "lush_grass"
weight = "(1 - smoothstep(slope, 0.28, 0.45)) * smoothstep(moisture, 0.36, 0.54) * smoothstep(temperature, 0.34, 0.5) * patchiness_mid"
variation = 0.3
variation_m = 650.0

[layer.talus_scree]
material = "scree"
blend_contrast = 0.5
weight = "smoothstep(slope, 0.28, 0.45) * (1 - smoothstep(temperature, 0.4, 0.56)) * (1 - max(smoothstep(wetness, 0.6, 0.85), smoothstep(shore, 0.5, 0.85)))"
variation = 0.25
variation_m = 600.0

[layer.wet_rock]
material = "wet_rock"
blend_contrast = 0.4
weight = "smoothstep(slope, 0.28, 0.45) * max(smoothstep(wetness, 0.6, 0.85), smoothstep(shore, 0.5, 0.85))"

[layer.exposed_rock]
material = "cliff_rock"
blend_contrast = 0.45
weight = "smoothstep(slope, 0.28, 0.45) * smoothstep(temperature, 0.4, 0.56) * (1 - max(smoothstep(wetness, 0.6, 0.85), smoothstep(shore, 0.5, 0.85)))"

[layer.snowfield]
material = "snow"
blend_contrast = 0.15
weight = "1 - smoothstep(temperature, 0.28, 0.42)"

[species.treeline_conifer]
kind = "conifer"
meshes = ["flora/spruce_c", "flora/spruce_d"]
density = "alpine_meadow * smoothstep(temperature, 0.42, 0.52) * smoothstep(patchiness_coarse, 0.4, 0.55)"
spacing_m = 7.0
scale = [0.6, 1.2]
exclusion_m = 2.0
water_buffer_m = 6.0

[species.dwarf_shrub]
kind = "shrub"
meshes = ["flora/juniper_a", "flora/juniper_b"]
density = "max(tundra_turf, alpine_meadow) * smoothstep(patchiness_fine, 0.45, 0.6)"
spacing_m = 2.5
scale = [0.4, 0.9]
slope_align = 0.4
exclusion_m = 0.8
water_buffer_m = 2.0

[species.tussock]
kind = "grass"
meshes = ["flora/grass_b", "flora/grass_dry_b"]
density = "(tundra_turf + alpine_meadow) * (1 - smoothstep(slope, 0.3, 0.5))"
spacing_m = 1.5
scale = [0.6, 1.2]
slope_align = 0.6

[species.alpine_flower]
kind = "flower"
meshes = ["flora/flower_purple", "flora/flower_yellow"]
density = "alpine_meadow * smoothstep(moisture, 0.36, 0.54) * smoothstep(patchiness_mid, 0.48, 0.6)"
spacing_m = 1.2
scale = [0.5, 1.0]
slope_align = 0.5

[species.talus_boulder]
kind = "rock"
meshes = ["scatter/boulder_a", "scatter/boulder_b"]
density = "talus_scree * (1 - smoothstep(slope, 0.45, 0.6))"
spacing_m = 4.0
scale = [0.5, 2.0]
slope_align = 0.8
exclusion_m = 1.0

[species.erratic]
kind = "rock"
meshes = ["scatter/boulder_c", "scatter/boulder_a"]
density = "max(tundra_turf, glacial_silt) * smoothstep(patchiness_fine, 0.58, 0.66)"
spacing_m = 12.0
scale = [1.5, 3.5]
slope_align = 0.3
exclusion_m = 3.0

[species.scree_stones]
kind = "debris"
meshes = ["scatter/stone_a", "scatter/stone_b"]
density = "max(talus_scree, glacial_wash) * (1 - smoothstep(slope, 0.45, 0.6))"
spacing_m = 1.5
scale = [0.4, 1.2]
slope_align = 1.0

[biome]
name = "arid"
description = "Arid desert: dune sand and rock pavement on the flats, dry wash gravel in the drainage, canyon cliffs on the steep ground."
sharpness = 3.0

[layer.dry_wash]
material = "river_rock"
blend_contrast = 0.5
weight = "smoothstep(flow, 0.5, 0.72) * step(slope < 0.35)"

[layer.playa_silt]
material = "silt"
weight = "smoothstep(deposition, 0.4, 0.75) * step(slope < 0.12) * (1 - smoothstep(flow, 0.5, 0.75))"
variation = 0.2
variation_m = 500.0

[layer.dune_sand]
material = "sand"
blend_contrast = 0.25
weight = "step(slope < 0.25) * (1 - smoothstep(moisture, 0.45, 0.65)) * patchiness_mid"
variation = 0.3
variation_m = 700.0

[layer.desert_pavement]
material = "gravel"
blend_contrast = 0.5
weight = "step(slope < 0.25) * (1 - smoothstep(moisture, 0.45, 0.65)) * (1 - patchiness_mid)"
variation = 0.25
variation_m = 600.0

[layer.scrub]
material = "dry_grass"
weight = "step(slope < 0.22) * smoothstep(moisture, 0.5, 0.75) * patchiness_coarse"
variation = 0.3
variation_m = 800.0

[layer.exposed_rock]
material = "cliff_rock"
blend_contrast = 0.45
weight = "max(smoothstep(slope, 0.4, 0.7), bedrock * wear)"

[species.saguaro]
kind = "cactus"
meshes = ["scatter/saguaro_a", "scatter/saguaro_b"]
density = "max(dune_sand, desert_pavement) * smoothstep(patchiness_coarse, 0.48, 0.6) * (1 - smoothstep(slope, 0.2, 0.35))"
spacing_m = 12.0
scale = [0.7, 1.4]
exclusion_m = 2.0

[species.barrel_cactus]
kind = "cactus"
meshes = ["scatter/barrel_cactus_a", "scatter/barrel_cactus_b"]
density = "desert_pavement * smoothstep(patchiness_fine, 0.45, 0.6)"
spacing_m = 5.0
scale = [0.6, 1.2]
exclusion_m = 0.8

[species.mesquite]
kind = "broadleaf"
meshes = ["nature/tree_fat_fall", "nature/tree_thin_fall", "nature/tree_plateau_fall"]
density = "smoothstep(flow, 0.4, 0.6) * smoothstep(moisture, 0.5, 0.75) * (1 - smoothstep(slope, 0.2, 0.35))"
spacing_m = 9.0
scale = [0.5, 0.9]
exclusion_m = 2.5
water_buffer_m = 4.0

[species.creosote]
kind = "shrub"
meshes = ["nature/plant_bushSmall", "nature/plant_bushTriangle", "nature/plant_bushLargeTriangle"]
density = "(scrub + 0.5 * dry_wash) * (1 - smoothstep(slope, 0.3, 0.5))"
spacing_m = 4.0
scale = [0.5, 1.1]
slope_align = 0.2
exclusion_m = 1.0

[species.bunchgrass]
kind = "grass"
meshes = ["nature/grass", "nature/grass_large"]
density = "max(scrub, 0.3 * dune_sand) * smoothstep(patchiness_fine, 0.38, 0.55)"
spacing_m = 2.5
scale = [0.5, 1.0]
slope_align = 0.5

[species.desert_boulder]
kind = "rock"
meshes = ["scatter/boulder_a", "scatter/boulder_b", "scatter/boulder_c"]
density = "0.7 * exposed_rock * smoothstep(wear, 0.5, 0.85) * (1 - smoothstep(slope, 0.4, 0.6))"
spacing_m = 6.0
scale = [0.6, 2.4]
slope_align = 0.7
exclusion_m = 1.5

[species.deadwood]
kind = "debris"
meshes = ["scatter/log_a", "scatter/stump_a", "scatter/stump_b"]
density = "dry_wash * smoothstep(patchiness_fine, 0.5, 0.62)"
spacing_m = 6.0
scale = [0.5, 1.2]
slope_align = 1.0

[species.pebbles]
kind = "debris"
meshes = ["scatter/stone_a", "scatter/stone_b"]
density = "max(desert_pavement, dry_wash) * (1 - smoothstep(slope, 0.4, 0.6))"
spacing_m = 2.0
scale = [0.4, 1.2]
slope_align = 1.0

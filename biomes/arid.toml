[biome]
name = "arid"
description = "Arid desert: dune sand and rock pavement on the flats, dry wash gravel in the drainage, canyon cliffs on the steep ground."
sharpness = 3.0

[layer.dry_wash]
material = "river_rock"
weight = "smoothstep(flow, 0.5, 0.72) * step(slope < 0.35)"

[layer.playa_silt]
material = "silt"
weight = "smoothstep(deposition, 0.4, 0.75) * step(slope < 0.12) * (1 - smoothstep(flow, 0.5, 0.75))"
variation = 0.2
variation_m = 500.0

[layer.dune_sand]
material = "sand"
weight = "step(slope < 0.25) * (1 - smoothstep(moisture, 0.45, 0.65)) * patchiness_mid"
variation = 0.3
variation_m = 700.0

[layer.desert_pavement]
material = "gravel"
weight = "step(slope < 0.25) * (1 - smoothstep(moisture, 0.45, 0.65)) * (1 - patchiness_mid)"
variation = 0.25
variation_m = 600.0

[layer.scrub]
material = "dry_grass"
weight = "step(slope < 0.22) * smoothstep(moisture, 0.5, 0.75) * patchiness_coarse"
variation = 0.3
variation_m = 800.0

[layer.exposed_rock]
material = "cliff_rock"
weight = "max(smoothstep(slope, 0.4, 0.7), bedrock * wear)"

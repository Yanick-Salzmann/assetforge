[biome]
name = "temperate"
description = "Temperate lowlands: river gravel and silt near water, grass and forest on the flats, bare rock and snow on the peaks."
sharpness = 3.0

[layer.riverbed_gravel]
material = "river_rock"
blend_contrast = 0.5
weight = "smoothstep(flow, 0.55, 0.75) * step(slope < 0.35)"

[layer.silt_flat]
material = "silt"
weight = "smoothstep(deposition, 0.5, 0.85) * step(slope < 0.15) * (1 - smoothstep(flow, 0.55, 0.8))"
variation = 0.2
variation_m = 500.0

[layer.mud]
material = "mud"
weight = "smoothstep(wetness, 0.5, 0.8) * step(slope < 0.2) * (1 - smoothstep(deposition, 0.5, 0.85))"
variation = 0.2
variation_m = 450.0

[layer.dry_grass]
material = "dry_grass"
weight = "step(slope < 0.22) * (1 - smoothstep(moisture, 0.36, 0.54)) * smoothstep(temperature, 0.25, 0.5) * patchiness_mid"
variation = 0.3
variation_m = 700.0

[layer.lush_grass]
material = "lush_grass"
weight = "step(slope < 0.22) * smoothstep(moisture, 0.36, 0.54) * smoothstep(temperature, 0.3, 0.55) * patchiness_mid"
variation = 0.3
variation_m = 650.0

[layer.forest_floor]
material = "forest_floor"
weight = "step(slope < 0.32) * smoothstep(moisture, 0.55, 0.85) * patchiness_coarse"
variation = 0.25
variation_m = 800.0

[layer.exposed_rock]
material = "cliff_rock"
blend_contrast = 0.45
weight = "max(smoothstep(slope, 0.4, 0.7), bedrock * wear)"

[layer.cliff_snow]
material = "snow"
blend_contrast = 0.15
weight = "smoothstep(slope, 0.35, 0.65) * (1 - smoothstep(temperature, 0.12, 0.3))"

[species.conifer]
kind = "conifer"
meshes = ["nature/tree_pineTallA_detailed", "nature/tree_pineTallB_detailed", "nature/tree_pineTallC_detailed", "nature/tree_pineTallD_detailed"]
density = "(forest_floor + 0.08 * lush_grass) * smoothstep(patchiness_coarse, 0.42, 0.55) * (1 - smoothstep(slope, 0.35, 0.55))"
spacing_m = 6.0
scale = [0.8, 1.5]
exclusion_m = 2.0
water_buffer_m = 8.0

[species.broadleaf]
kind = "broadleaf"
meshes = ["nature/tree_oak", "nature/tree_default", "nature/tree_detailed", "nature/tree_plateau"]
density = "(forest_floor + 0.08 * lush_grass) * (1 - smoothstep(patchiness_coarse, 0.42, 0.55)) * (1 - smoothstep(slope, 0.35, 0.55))"
spacing_m = 8.0
scale = [0.7, 1.3]
exclusion_m = 2.5
water_buffer_m = 8.0

[species.hazel_shrub]
kind = "shrub"
meshes = ["nature/plant_bushDetailed", "nature/plant_bushLarge", "nature/plant_bush"]
density = "max(0.3 * lush_grass, forest_floor) * smoothstep(patchiness_fine, 0.45, 0.6) * (1 - smoothstep(slope, 0.35, 0.55))"
spacing_m = 3.0
scale = [0.6, 1.2]
slope_align = 0.2
exclusion_m = 1.0
water_buffer_m = 3.0

[species.fern]
kind = "shrub"
meshes = ["nature/plant_flatTall", "nature/plant_flatShort", "nature/grass_leafsLarge"]
density = "forest_floor * smoothstep(wetness, 0.3, 0.55) * (1 - smoothstep(slope, 0.35, 0.55))"
spacing_m = 2.0
scale = [0.5, 1.0]
slope_align = 0.5
exclusion_m = 0.5
water_buffer_m = 2.0

[species.grass_tuft]
kind = "grass"
meshes = ["nature/grass", "nature/grass_large"]
density = "(dry_grass + lush_grass) * (1 - smoothstep(slope, 0.3, 0.5))"
spacing_m = 1.5
scale = [0.7, 1.3]
slope_align = 0.6

[species.wildflower]
kind = "flower"
meshes = ["nature/flower_purpleA", "nature/flower_redA", "nature/flower_yellowA", "nature/flower_redB"]
density = "lush_grass * smoothstep(patchiness_mid, 0.5, 0.62) * (1 - smoothstep(slope, 0.25, 0.45))"
spacing_m = 1.2
scale = [0.6, 1.1]
slope_align = 0.5

[species.boulder]
kind = "rock"
meshes = ["nature/rock_largeA", "nature/rock_largeB", "nature/rock_largeC", "nature/rock_largeD"]
density = "0.7 * exposed_rock * smoothstep(wear, 0.5, 0.85) * (1 - smoothstep(slope, 0.4, 0.6)) * (1 - smoothstep(flow, 0.55, 0.75))"
spacing_m = 5.0
scale = [0.6, 2.2]
slope_align = 0.7
exclusion_m = 1.5

[species.deadwood]
kind = "debris"
meshes = ["nature/log", "nature/log_large", "nature/stump_old", "nature/stump_round"]
density = "forest_floor * smoothstep(patchiness_fine, 0.48, 0.62) * (1 - smoothstep(slope, 0.35, 0.55))"
spacing_m = 4.0
scale = [0.6, 1.4]
slope_align = 1.0
exclusion_m = 0.5

[species.river_pebbles]
kind = "debris"
meshes = ["nature/rock_smallFlatA", "nature/rock_smallFlatB", "nature/rock_smallFlatC", "nature/rock_smallA"]
density = "max(riverbed_gravel, 0.5 * silt_flat) * (1 - smoothstep(slope, 0.4, 0.6))"
spacing_m = 2.0
scale = [0.5, 1.5]
slope_align = 1.0

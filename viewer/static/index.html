<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>assetforge viewer</title>
<link rel="stylesheet" href="/static/viewer.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<aside id="panel">
  <h1>assetforge viewer</h1>
  <label>Terrain <select id="terrain"><option value="">(none)</option></select></label>
  <label class="asset-only">Asset <select id="asset"></select></label>
  <label class="asset-only">LOD <select id="lod"></select></label>
  <fieldset id="terrain-options" class="terrain-only">
    <legend>Terrain</legend>
    <label><input type="checkbox" id="water" checked> water surface</label>
    <label><input type="checkbox" id="water-tint"> water mask tint</label>
    <label><input type="checkbox" id="colour-macro" checked> macro colour tint</label>
    <label><input type="checkbox" id="height-blend" checked> height-based blending</label>
    <label><input type="checkbox" id="scatter" checked> scatter instances</label>
    <label><input type="checkbox" id="buildings" checked> buildings</label>
  </fieldset>
  <fieldset id="mode">
    <legend>Shading</legend>
    <label><input type="radio" name="mode" value="textured" checked> textured</label>
    <label class="terrain-only"><input type="radio" name="mode" value="splat"> splat layers</label>
    <label><input type="radio" name="mode" value="backfaces"> back faces red</label>
    <label><input type="radio" name="mode" value="normals"> normals</label>
    <label><input type="radio" name="mode" value="wireframe"> wireframe</label>
  </fieldset>
  <fieldset>
    <legend>Camera</legend>
    <div class="row">
      <button id="frame" type="button">Frame</button>
      <button id="ground" type="button">Ground level</button>
      <button id="village" type="button" class="terrain-only">Buildings</button>
    </div>
    <label><input type="checkbox" id="spin"> auto-orbit</label>
  </fieldset>
  <label><input type="checkbox" id="human" checked> 1.8 m reference</label>
  <dl id="info"></dl>
  <p id="status"></p>
</aside>
<script type="module" src="/static/viewer.js"></script>
</body>
</html>
